[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alfa-signal-backend"
version = "0.1.0"
description = "Personalized business-news analytics API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "openai>=1.40.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "pymupdf>=1.24.0,<2.0.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23.0,<5.0.0",
  "pandas>=2.2.0,<4.0.0",
  "pypdf>=5.0.0,<7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.unittest]
start-directory = "tests"
