server {
    # Только IPv4: внутри сети Docker IPv6 не нужен, а на хостах с выключенным IPv6 строка
    # «listen [::]:8080» не даёт Nginx запуститься.
    listen 8080;
    server_name _;
    server_tokens off;

    # За Nginx на хосте (deploy/nginx) настоящий адрес клиента — в X-Forwarded-For; доверяем ему
    # только от адресов внутренней сети Docker. Без прокси клиент подключается напрямую, и его
    # заголовок игнорируется. По X-Real-IP backend ограничивает подбор паролей.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
